name: Build & deploy

on:
  # Code pushes rebuild the *site* only and republish the dataset that is
  # already live (see the two build steps below).
  push:
    branches: [main]
  # The schedule is what refreshes the *data*. Monthly is the natural cadence —
  # Finnish statutes are confirmed in batches and the säädöskokoelma crawl
  # covers the current year on every run.
  schedule:
    - cron: "0 5 1 * *"
  # Manual data refresh between scheduled runs.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The seed is the offline fallback for the whole app — fail fast if a
      # hand-edit broke the data contract.
      - run: npm run validate:seed
      # A code push has no reason to re-crawl: the amendment crawl is
      # throttle-bound and best-effort, so re-running it on an unrelated change
      # can publish *less* data than is already live. `prebuild` (ensure:data)
      # pulls the currently published dataset from the live site instead, and
      # only falls back to crawling if no mirror answers.
      - name: Build the site, reusing the published dataset
        if: github.event_name == 'push'
        run: npm run build
      # Scheduled / manual runs are the ones that refresh the data. The
      # pipeline always exits 0 and falls back to the committed seed if
      # Finlex/EUR-Lex are unreachable, so the build never fails on data.
      - name: Refresh the dataset, then build
        if: github.event_name != 'push'
        run: npm run build:all
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
