name: Build & deploy

on:
  push:
    branches: [main]
  # Deploying is the only thing that refreshes the data: the pipeline runs at
  # build time, so without a push the dataset is as old as the last commit.
  # Monthly is the natural cadence — Finnish statutes are confirmed in batches
  # and the säädöskokoelma crawl covers the current year on every run.
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The seed is the offline fallback for the whole app — fail fast if a
      # hand-edit broke the data contract.
      - run: npm run validate:seed
      # `npm run build` runs the data pipeline (prebuild) then vite build.
      # The pipeline always exits 0 and falls back to the committed seed if
      # Finlex/EUR-Lex are unreachable, so the build never fails on data.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
